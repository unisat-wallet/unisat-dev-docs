openapi: 3.0.3
info:
  title: Inscribe API
  version: 1.0.0
  description: >-
    Legacy V2 inscription API. `GET /v2/inscribe/order/summary` remains supported; all other V2 inscription endpoints are deprecated and new integrations must use the Inscribe API V5 endpoints under /inscribe-v5. See open-api/inscribe-v5-migration.md.
  contact:
    email: contact@unisat.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://open-api.unisat.io
  - url: https://open-api-staging.unisat.io
  - url: https://open-api-testnet.unisat.io
  - url: https://open-api-testnet4.unisat.io
  - url: https://open-api-signet.unisat.io
  - url: https://open-api-fractal.unisat.io
  - url: https://open-api-fractal-testnet.unisat.io
tags:
  - name: Inscribe
    description: Legacy V2 inscription workflow. The order summary endpoint remains supported; all other V2 endpoints are deprecated in favor of Inscribe V5.
paths:
  /v2/inscribe/order/summary:
    get:
      tags:
        - Inscribe
      operationId: getOrderSummary
      summary: Summarize inscription order counts
      description: >-
        Returns orderCount totals by status for the current API key, including pending, inscribing, minted, closed, and refunded buckets. Use it for dashboard totals and reconcile the counts before drilling into order lists; it never creates payment state or broadcasts transactions.
      x-unisat-domain: inscribe
      x-unisat-network: multi
      x-unisat-status: recommended
      x-unisat-readonly: true
      x-unisat-requires-confirmation: false
      x-unisat-ai-hints:
        - Safe read-only inscription query: call without extra confirmation when required identifiers are provided.
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: integer
                    format: int32
                  msg:
                    type: string
                    example: OK
                  data:
                    $ref: "#/components/schemas/OrderSummary"
        "401":
          description: Invalid API Key
  /v2/inscribe/order/list:
    get:
      deprecated: true
      tags:
        - Inscribe
      operationId: getOrderList
      summary: List inscription orders with status details
      description: >-
        Returns paginated inscription orders, including orderId, status, payment amounts, receiveAddress, fee fields, counts, and optional file details. Use it to monitor order progress or reconcile payments; check status, paidAmount, amount, and files before taking follow-up signing or refund actions.
      x-unisat-domain: inscribe
      x-unisat-network: multi
      x-unisat-status: recommended
      x-unisat-readonly: true
      x-unisat-requires-confirmation: false
      x-unisat-ai-hints:
        - Safe read-only inscription query: call without extra confirmation when required identifiers are provided.
      parameters:
        - name: cursor
          description: Start offset
          in: query
          required: true
          schema:
            type: integer
          example: 0
        - name: size
          description: Number of items returned
          in: query
          required: true
          schema:
            type: integer
          example: 16
        - name: sort
          description: Sort by (asc/desc)
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
          example: asc
        - name: status
          description: Status of order
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - inscribing
              - minted
              - closed
              - refunded
        - name: receiveAddress
          description: ReceiveAddress of order
          in: query
          required: false
          schema:
            type: string
        - name: clientId
          description: ClientId of order
          in: query
          required: false
          schema:
            type: string
        - name: withFiles
          description: Whether to include files
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: integer
                    format: int32
                    enum:
                      - 0
                      - -1
                  msg:
                    type: string
                    example: OK
                  data:
                    properties:
                      detail:
                        type: array
                        items:
                          $ref: "#/components/schemas/Order"
                      start:
                        type: integer
                      total:
                        type: integer
        "401":
          description: Invalid API Key

  /v2/inscribe/order/{orderId}:
    get:
      deprecated: true
      tags:
        - Inscribe
      operationId: getOrderById
      summary: Get one inscription order state
      description: >-
        Returns a single order with status, payAddress, receiveAddress, paidAmount, required amount, fee breakdown, inscription counts, file statuses, and refund fields. Poll it before payment, commit signing, reveal signing, or refund decisions; verify status and amount fields because this endpoint is read-only.
      x-unisat-domain: inscribe
      x-unisat-network: multi
      x-unisat-status: recommended
      x-unisat-readonly: true
      x-unisat-requires-confirmation: false
      x-unisat-ai-hints:
        - Safe read-only inscription query: call without extra confirmation when required identifiers are provided.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: integer
                    format: int32
                  msg:
                    type: string
                    example: OK
                  data:
                    $ref: "#/components/schemas/Order"
        "401":
          description: Invalid API Key
  /v2/inscribe/order/create:
    post:
      deprecated: true
      tags:
        - Inscribe
      operationId: createOrder
      summary: Create generic inscription payment order
      description: >-
        Creates an inscription order for arbitrary files and returns orderId, payAddress, required amount, receiveAddress, fee breakdown, and order/file status. Confirm receiveAddress, file data, outputValue, feeRate, dev fee fields, and expected payment amount before calling because it starts payable order state.
      x-unisat-domain: inscribe
      x-unisat-network: multi
      x-unisat-status: recommended
      x-unisat-readonly: false
      x-unisat-requires-confirmation: true
      x-unisat-ai-hints:
        - Creates payable inscription order state: ask for explicit user confirmation before calling.
        - Verify receive address, fee rate, output value, content or asset parameters, and total payment amount.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateParams"
        required: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: integer
                    format: int32
                  msg:
                    type: string
                  data:
                    $ref: "#/components/schemas/Order"
        "401":
          description: Invalid API Key
  /v2/inscribe/order/create/brc20-deploy:
    post:
      deprecated: true
      tags:
        - Inscribe
      operationId: createOrderBRC20Deploy
      summary: Create deprecated BRC-20 deploy inscription order
      description: >-
        Creates a payable inscription order for legacy BRC-20 deploy content and returns orderId, payAddress, amount, receiveAddress, fee fields, and status. Confirm ticker, max, limit, receiveAddress, feeRate, outputValue, and payment amount before use; prefer newer workflows when available.
      x-unisat-domain: inscribe
      x-unisat-network: multi
      x-unisat-status: deprecated
      x-unisat-readonly: false
      x-unisat-requires-confirmation: true
      x-unisat-ai-hints:
        - Creates payable inscription order state: ask for explicit user confirmation before calling.
        - Verify receive address, fee rate, output value, content or asset parameters, and total payment amount.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateBRC20DeployParams"
        required: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: integer
                    format: int32
                  msg:
                    type: string
                  data:
                    $ref: "#/components/schemas/Order"
        "401":
          description: Invalid API Key
  /v2/inscribe/order/create/brc20-mint:
    post:
      deprecated: true
      tags:
        - Inscribe
      operationId: createOrderBRC20Mint
      summary: Create deprecated BRC-20 mint inscription order
      description: >-
        Creates a payable inscription order for legacy BRC-20 mint content and returns orderId, payAddress, amount, receiveAddress, fee fields, and status. Confirm ticker, mint amount, count, receiveAddress, feeRate, outputValue, and total payment before use; prefer newer workflows when available.
      x-unisat-domain: inscribe
      x-unisat-network: multi
      x-unisat-status: deprecated
      x-unisat-readonly: false
      x-unisat-requires-confirmation: true
      x-unisat-ai-hints:
        - Creates payable inscription order state: ask for explicit user confirmation before calling.
