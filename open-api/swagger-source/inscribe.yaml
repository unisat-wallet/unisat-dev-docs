  /v2/inscribe/order/sign-reveal/brc20-5byte-mint:
    post:
      deprecated: true
      tags:
        - Inscribe
      operationId: signRevealBRC205ByteMint
      summary: Submit deprecated signed 5-byte reveal
      description: >-
        Submits the signed reveal PSBT for a legacy BRC-20 5-byte mint order and returns inscriptionId when accepted. Verify orderId, PSBT content, receiveAddress, inscription payload, and fees before calling; deprecated endpoint kept for compatibility.
      x-unisat-domain: inscribe
      x-unisat-network: multi
      x-unisat-status: deprecated
      x-unisat-readonly: false
      x-unisat-requires-confirmation: true
      x-unisat-ai-hints:
