  /v2/inscribe/order/sign-commit/brc20-5byte-mint:
    post:
      deprecated: true
      tags:
        - Inscribe
      operationId: signCommitBRC205ByteMint
      summary: Submit deprecated signed 5-byte commit
      description: >-
        Submits the signed commit PSBT for a legacy BRC-20 5-byte mint order and returns next-step PSBT/signing material when accepted. Verify orderId, PSBT content, payer inputs, payment amount, and fees before calling; deprecated endpoint kept for compatibility.
      x-unisat-domain: inscribe
      x-unisat-network: multi
      x-unisat-status: deprecated
      x-unisat-readonly: false
      x-unisat-requires-confirmation: true
      x-unisat-ai-hints:
        - Submits signed transaction data: require explicit confirmation and verify orderId, PSBT, addresses, and fees before calling.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderSignCommitBRC205ByteMintParams"
        required: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: integer
                    format: int32
                  msg:
                    type: string
                  data:
