  /v2/inscribe/order/create/runes-etch:
    post:
      deprecated: true
      tags:
        - Inscribe
      operationId: createOrderRunesEtch
      summary: Create Runes etch inscription order
      description: >-
        Creates a payable inscription order for Runes etching and returns orderId, payAddress, amount, receiveAddress, fee fields, and status. Confirm rune name/symbol/divisibility, premine and terms, file payload, receiveAddress, feeRate, outputValue, and total payment before calling.
      x-unisat-domain: inscribe
      x-unisat-network: multi
      x-unisat-status: recommended
      x-unisat-readonly: false
      x-unisat-requires-confirmation: true
      x-unisat-ai-hints:
        - Creates payable inscription order state: ask for explicit user confirmation before calling.
        - Verify receive address, fee rate, output value, content or asset parameters, and total payment amount.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRunesEtchParams"
        required: true
      responses:
