  /v2/inscribe/order/request-commit/brc20-5byte-mint:
    post:
      deprecated: true
      tags:
        - Inscribe
      operationId: requestCommitBRC205ByteMint
      summary: Prepare deprecated 5-byte commit PSBT
      description: >-
        Returns commit PSBT hex and inputsToSign for a paid legacy BRC-20 5-byte mint order. Confirm orderId, payerAddress, payerPubkey, payment status, and signing indexes before signing; deprecated endpoint kept for compatibility.
      x-unisat-domain: inscribe
      x-unisat-network: multi
      x-unisat-status: deprecated
      x-unisat-readonly: false
      x-unisat-requires-confirmation: true
      x-unisat-ai-hints:
        - Prepares payment/signing material: ask for confirmation and verify orderId, payer address, pubkey, PSBT, and signing indexes.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequestCommitBRC205ByteMintParams"
        required: true
      responses:
