  /v2/inscribe/order/create/runes-mint:
    post:
      deprecated: true
      tags:
        - Inscribe
      operationId: createOrderRunesMint
      summary: Create Runes mint inscription order
      description: >-
        Creates a payable inscription order for Runes minting and returns orderId, payAddress, amount, receiveAddress, fee fields, and status. Confirm runeid, count, receiveAddress, feeRate, outputValue, dev fee fields, and total payment before calling.
      x-unisat-domain: inscribe
      x-unisat-network: multi
      x-unisat-status: recommended
      x-unisat-readonly: false
      x-unisat-requires-confirmation: true
      x-unisat-ai-hints:
