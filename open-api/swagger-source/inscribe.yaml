                    type: integer
                    format: int32
                  msg:
                    type: string
                  data:
                    $ref: "#/components/schemas/Order"
        "401":
          description: Invalid API Key
  /v2/inscribe/order/request-commit:
    post:
      deprecated: true
      tags:
        - Inscribe
      operationId: requestCommit
      summary: Prepare inscription commit PSBT
      description: >-
        Returns commit transaction PSBT hex and inputsToSign for a paid inscription order. Confirm orderId, payerAddress, payerPubkey, payment status, and signing indexes before signing; this prepares spend material but later sign endpoints advance the on-chain workflow.
      x-unisat-domain: inscribe
      x-unisat-network: multi
      x-unisat-status: recommended
      x-unisat-readonly: false
      x-unisat-requires-confirmation: true
      x-unisat-ai-hints:
        - Prepares payment/signing material: ask for confirmation and verify orderId, payer address, pubkey, PSBT, and signing indexes.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequestCommitBRC205ByteMintParams"
        required: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: integer
                    format: int32
                  msg:
                    type: string
                  data:
                    $ref: "#/components/schemas/OrderRequestCommitBRC205ByteMintResponse"
        "401":
          description: Invalid API Key
  /v2/inscribe/order/sign-commit:
    post:
      deprecated: true
      tags:
        - Inscribe
      operationId: signCommit
      summary: Submit signed inscription commit PSBT
      description: >-
        Submits the signed commit PSBT for an inscription order and returns next-step PSBT/signing material when accepted. Verify orderId, PSBT content, payer inputs, payment amount, and fee assumptions before calling because it advances the transaction workflow.
      x-unisat-domain: inscribe
      x-unisat-network: multi
      x-unisat-status: recommended
      x-unisat-readonly: false
      x-unisat-requires-confirmation: true
      x-unisat-ai-hints:
        - Submits signed transaction data: require explicit confirmation and verify orderId, PSBT, addresses, and fees before calling.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderSignCommitBRC205ByteMintParams"
        required: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: integer
                    format: int32
                  msg:
                    type: string
                  data:
                    $ref: "#/components/schemas/OrderSignCommitBRC205ByteMintResponse"
        "401":
          description: Invalid API Key
  /v2/inscribe/order/sign-reveal:
    post:
      deprecated: true
      tags:
        - Inscribe
      operationId: signReveal
      summary: Submit signed inscription reveal PSBT
      description: >-
        Submits the signed reveal PSBT and returns the resulting inscriptionId when the reveal is accepted. Verify orderId, PSBT content, receiveAddress, file payload, and fees before calling because this can finalize inscription creation on-chain.
      x-unisat-domain: inscribe
      x-unisat-network: multi
      x-unisat-status: recommended
      x-unisat-readonly: false
      x-unisat-requires-confirmation: true
      x-unisat-ai-hints:
        - Submits signed transaction data: require explicit confirmation and verify orderId, PSBT, addresses, and fees before calling.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderSignRevealBRC205ByteMintParams"
        required: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: integer
                    format: int32
                  msg:
                    type: string
                  data:
                    $ref: "#/components/schemas/OrderSignRevealBRC205ByteMintResponse"
        "401":
