openapi: 3.0.3
info:
  title: Inscribe API V5
  version: 5.0.0
  description: Current inscription API. V5 replaces the deprecated /v2/inscribe endpoints and uses the order workflow implemented by the minting service.
tags:
  - name: Inscribe V5
    description: Current multi-network inscription workflow. V5 endpoints require a bearer API key and scope orders to the calling OpenAPI application.
paths:
  /v5/inscribe/order/list:
    get:
      summary: get address status
      description: get address status
      parameters:
        - name: cursor
          required: true
          description: Starting cursor
          schema:
            type: number
            default: 0
          in: query
        - name: size
          required: true
          description: The amount returned
          schema:
            type: number
            default: 10
          in: query
        - name: filter
          required: true
          description: ''
          schema:
            type: string
            default: ''
          in: query
        - name: status
          required: false
          description: ''
          schema:
            type: string
            default: ''
          in: query
        - name: clientId
          required: false
          description: ''
          schema:
            type: string
            default: ''
          in: query
        - name: receiveAddress
          required: false
          description: ''
          schema:
            type: string
            default: ''
          in: query
        - name: withFiles
          required: false
          description: ''
          schema:
            type: string
            default: ''
          in: query
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    description: An API call that encounters an error  will return 0 as its status code and display the cause of the error under the result field.
                  msg:
                    type: string
                    description: The cause of the error
                  data:
                    type: string
                    properties:
                      total:
                        type: number
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            orderId:
                              type: string
                            status:
                              type: string
                            payAddress:
                              type: string
                            receiveAddress:
                              type: string
                            amount:
                              type: number
                            balance:
                              type: number
                            feeRate:
                              type: number
                            minerFee:
                              type: number
                            outputValueFee:
                              type: number
                            serviceFee:
                              type: number
                            count:
                              type: number
                            pendingCount:
                              type: number
                            unconfirmedCount:
                              type: number
                            confirmedCount:
                              type: number
                            createTimestamp:
                              type: number
                            point:
                              type: number
                            batch1:
                              type: number
                            batch2:
                              type: number
      tags:
        - Inscribe V5
      operationId: v5GetOrderList
  /v5/inscribe/order/{orderId}:
    get:
      summary: get order info
      description: get order info
      parameters:
        - name: orderId
          required: true
          description: orderId
          schema:
            type: string
            default: ''
          in: path
        - name: orderId
          required: true
          description: orderId
          schema:
            type: string
            default: ''
          in: query
        - name: compactFiles
          required: false
          description: Return compact file template, numeric statuses, and sparse broadcast references instead of files.
          schema:
            type: boolean
            default: false
          in: query
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    description: An API call that encounters an error  will return 0 as its status code and display the cause of the error under the result field.
                  msg:
                    type: string
                    description: The cause of the error
                  data:
                    type: object
                    properties:
                      orderId:
                        type: string
                      status:
                        type: string
                      payAddress:
                        type: string
                      receiveAddress:
                        type: string
                      amount:
                        type: number
                      balance:
                        type: number
                      feeRate:
                        type: number
                      minerFee:
                        type: number
                      outputValueFee:
                        type: number
                      serviceFee:
                        type: number
                      devFee:
                        type: number
                      files:
                        type: array
                        items:
                          type: object
                          properties:
                            filename:
                              type: string
                            size:
                              type: number
                            inscriptionId:
                              type: string
                            txid:
                              type: string
                            status:
                              type: string
                            title:
                              type: string
                            traits:
                              type: object
                            gallery:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  title:
                                    type: string
                                  traits:
                                    type: object
                      count:
                        type: number
                      pendingCount:
                        type: number
                      unconfirmedCount:
                        type: number
                      confirmedCount:
                        type: number
                      createTimestamp:
                        type: number
                      point:
                        type: number
                      batch1:
                        type: number
                      batch2:
                        type: number
                      paidInscriptions:
                        type: array
                        required: false
                        items:
                          type: object
                          properties:
                            inscriptionId:
                              type: string
                            inscriptionNumber:
                              type: number
                            contentType:
                              type: string
                            timestamp:
                              type: number
      tags:
        - Inscribe V5
      operationId: v5GetOrder
