        content:
          application/json:
            schema:
              required:
                - items
              type: object
              properties:
                items:
                  type: array
                  items:
                    required:
                      - address
                      - tickIn
                      - tickOut
                      - amountIn
                      - amountOut
                      - feeTick
                      - slippage
                      - exactType
                      - ts
                      - feeAmount
                      - feeTickPrice
                    type: object
                    properties:
                      address:
                        type: string
                      tickIn:
                        description: Input tick
                        type: string
                      tickOut:
                        description: Output tick
                        type: string
                      amountIn:
                        description: The amount of input tick
                        type: string
                      amountOut:
                        description: The amount of output tick
                        type: string
                      feeTick:
                        description: Tick used as fee. Use /v1/brc20-swap/config to fetch available feeTicks.
                        type: string
                      slippage:
                        type: string
                      exactType:
                        enum:
                          - exactIn
                          - exactOut
                        type: string
                      ts:
                        description: Timestamp (seconds)
                        type: number
                      feeAmount:
                        description: The fee that the user needs to pay
                        type: string
                      feeTickPrice:
                        description: The price of fee tick
                        type: string
                      sigs:
                        description: User signature
                        type: array
                        items:
                          type: string
                      payType:
                        enum:
                          - tick
                          - freeQuota
                          - assetFeeTick
                        type: string
                        description: Pay type. Allowed values are tick, freeQuota, and assetFeeTick.
                      rememberPayType:
                        type: boolean
                      assetFeeTick:
                        description: Required when payType is assetFeeTick. Used as the fee asset tick for swap.
                        type: string
                      assetFeeAmount:
                        description: Required when payType is assetFeeTick. Fee amount charged in assetFeeTick.
                        type: string
                      assetFeeTickPrice:
                        description: Required when payType is assetFeeTick. Price of assetFeeTick.
                        type: string
                    additionalProperties: false
              additionalProperties: false
        required: true
