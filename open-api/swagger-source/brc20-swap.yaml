openapi: 3.0.3
info:
  title: BRC20 Swap API
  version: 1.0.4
  description: >-
    BRC20 Swap API provides a set of Fractal-only interfaces for BRC20 Swap and InSwap services.
    BRC20 Swap and InSwap are equivalent product names; user requests that mention InSwap should be routed to these /v1/brc20-swap/* endpoints.
    It allows users to interact with the BRC20 Swap ecosystem, including balance checks,
    pool information, liquidity management, quote/preparation steps, liquidity operations, swap operations, and token transfers.
  contact:
    email: contact@unisat.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://open-api-fractal.unisat.io
tags:
  - name: Swap-BRC20
    description: Fractal-only BRC20 Swap / InSwap service. InSwap is an alias of BRC20 Swap.
paths:
  /v1/brc20-swap/config:
    get:
      tags:
        - Swap-BRC20
      operationId: getBrc20SwapConfig
      summary: Get InSwap module, fee tick, and deposit confirmation config
      description: >-
        Returns Fractal BRC20 Swap service settings, including module id, service gas tick, and confirmation thresholds for direct and matching deposits.
      x-unisat-domain: swap
      x-unisat-network: fractal
      x-unisat-status: recommended
      x-unisat-readonly: true
      x-unisat-requires-confirmation: false
      x-unisat-aliases: [InSwap, BRC20 Swap]
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      moduleId:
                        type: string
                      serviceGasTick:
                        description: The tick used for the second layer gas.
                        type: string
                      pendingDepositDirectNum:
                        description: Number of confirmations required for direct deposit.
                        type: number
                      pendingDepositMatchingNum:
                        description: Number of confirmations required for matching deposit.
                        type: number
                    additionalProperties: false
                required:
                  - msg
                  - code
                  - data
  /v1/brc20-swap/balance:
    get:
      tags:
        - Swap-BRC20
      operationId: getBrc20SwapBalance
      summary: Get an address's InSwap balance for one tick
      description: >-
        Returns module, swap, pending-swap, and pending-available balances plus decimal precision for a specific address and token tick.
      x-unisat-domain: swap
      x-unisat-network: fractal
      x-unisat-status: recommended
      x-unisat-readonly: true
      x-unisat-requires-confirmation: false
      x-unisat-aliases: [InSwap, BRC20 Swap]
      parameters:
        - schema:
            type: string
          in: query
          name: address
          required: true
        - schema:
            type: string
          in: query
          name: tick
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      balance:
                        type: object
                        properties:
                          module:
                            description: Confirmed module balance.
                            type: string
                          swap:
                            description: Confirmed swap balance.
                            type: string
                          pendingSwap:
                            description: The balance converted from pending to swap.
                            type: string
                          pendingAvailable:
                            description: The balance converted from pending to module.
                            type: string
                        additionalProperties: false
                      decimal:
                        type: string
                    additionalProperties: false
                required:
                  - msg
                  - code
                  - data
  /v1/brc20-swap/all_balance:
    get:
      tags:
        - Swap-BRC20
      operationId: getBrc20SwapAllBalances
      summary: List all InSwap balances for an address
      description: >-
        Returns a ticker-keyed balance map with module, swap, pending balances, decimals, asset type, network type, and optional price metadata.
      x-unisat-domain: swap
      x-unisat-network: fractal
      x-unisat-status: recommended
      x-unisat-readonly: true
      x-unisat-requires-confirmation: false
      x-unisat-aliases: [InSwap, BRC20 Swap]
      parameters:
        - schema:
            type: string
          in: query
          name: address
          required: true
        - schema:
            type: string
          in: query
          name: pubkey
          required: false
      responses:
        "200":
          description: Successful response returning all token balances for the address.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                  msg:
                    type: string
                  data:
                    type: object
                    description: A map where each key is a token ticker symbol.
                    additionalProperties:
                      type: object
                      properties:
                        balance:
                          type: object
                          properties:
                            module:
                              type: string
                              description: Confirmed module balance.
                            swap:
                              type: string
                              description: Confirmed swap balance.
                            pendingSwap:
                              type: string
                              description: The balance converted from pending to swap.
                            pendingAvailable:
                              type: string
                              description: The balance converted from pending to module.
                          additionalProperties: false
                        decimal:
                          type: string
                          description: Token decimal precision.
                        assetType:
                          type: string
                          description: Type of the asset (e.g., 'brc20', 'btc').
                        networkType:
                          type: string
                          description: Underlying network (e.g., 'BITCOIN_MAINNET', 'FRACTAL_BITCOIN_MAINNET').
                        price:
                          type: number
                          description: Current price of the token, if available.
                      required:
                        - balance
                        - decimal
                        - assetType
                        - networkType
                required:
                  - code
                  - msg
                  - data
  /v1/brc20-swap/pool_info:
    get:
      tags:
        - Swap-BRC20
      operationId: getBrc20SwapPoolInfo
      summary: Get pool liquidity, volume, and reward details for a pair
      description: >-
        Returns pair-level pool metadata, including whether the pool exists, token reserves, LP supply, TVL, recent volume, reward fields, and per-token asset metadata.
      x-unisat-domain: swap
      x-unisat-network: fractal
      x-unisat-status: recommended
      x-unisat-readonly: true
      x-unisat-requires-confirmation: false
      x-unisat-aliases: [InSwap, BRC20 Swap]
      parameters:
        - schema:
            type: string
          in: query
          name: tick0
          required: false
        - schema:
            type: string
          in: query
          name: tick1
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      existed:
                        description: Is the pool existed
                        type: boolean
                      addLiq:
                        description: Has LP been added to the pool
                        type: boolean
                      tick0:
                        type: string
                      tick1:
                        type: string
                      lp:
                        description: Quantity of pool lp
                        type: string
                      tvl:
                        type: string
                      volume24h:
                        type: string
                      volume7d:
                        type: string
                      reward0:
                        type: string
                      reward1:
                        type: string
                      activedPid:
                        description: Active pool ID
                        type: string
                      marketCap:
                        description: Market cap
                        type: number
                      marketCapTick:
                        description: Market cap tick
                        type: string
                      networkType0:
                        description: Network type for tick0
                        type: string
                      networkType1:
                        description: Network type for tick1
                        type: string
                      assetType0:
                        description: Asset type for tick0
                        type: string
                      assetType1:
                        description: Asset type for tick1
                        type: string
                      l1Tick0:
                        description: L1 tick0
                        type: string
                      l1Tick1:
                        description: L1 tick1
                        type: string
                      amount0:
                        description: Amount of tick0
                        type: string
                      amount1:
                        description: Amount of tick1
                        type: string
                      volume30d:
                        description: 30 days volume
                        type: string
                    additionalProperties: false
                required:
                  - msg
                  - code
                  - data
  /v1/brc20-swap/select:
    get:
      tags:
        - Swap-BRC20
      operationId: getBrc20SwapSelect
      summary: List address ticks available for InSwap trading
      description: >-
        Returns BRC-20 ticks available to an address for swap operations, including decimal precision, module balance, and swap balance.
      x-unisat-domain: swap
      x-unisat-network: fractal
      x-unisat-status: recommended
      x-unisat-readonly: true
      x-unisat-requires-confirmation: false
      x-unisat-aliases: [InSwap, BRC20 Swap]
      parameters:
        - schema:
            type: string
          in: query
          name: address
          required: true
        - schema:
            type: string
          in: query
          name: search
          required: false
          description: Fuzzy matching
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                  msg:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        tick:
                          type: string
                        decimal:
                          type: string
                        brc20Balance:
                          description: Module balance (not participate in swap calculations)
                          type: string
                        swapBalance:
                          description: Swap balance
                          type: string
                      additionalProperties: false
                required:
                  - msg
                  - code
                  - data
  /v1/brc20-swap/pre_deploy_pool:
    get:
      tags:
        - Swap-BRC20
      operationId: getBrc20SwapPreDeployPool
      summary: Prepare signatures and fees for deploying an InSwap pool
      description: >-
        Returns signature ids, sign messages, fee amount, fee tick price, fee balance, and USD fee value needed before submitting a pool deployment.
      x-unisat-domain: swap
      x-unisat-network: fractal
      x-unisat-status: recommended
      x-unisat-readonly: true
      x-unisat-requires-confirmation: false
      x-unisat-aliases: [InSwap, BRC20 Swap]
      parameters:
        - schema:
            type: string
          in: query
          name: address
          required: true
        - schema:
            type: string
          in: query
          name: tick0
          required: true
        - schema:
            type: string
          in: query
          name: tick1
          required: true
        - schema:
            type: number
          in: query
          name: ts
          required: true
          description: Timestamp (seconds)
        - schema:
            type: string
          in: query
          name: feeTick
          required: true
          description: Tick used as fee. Use /v1/brc20-swap/config to fetch available feeTicks.
        - schema:
            enum:
              - tick
              - freeQuota
            type: string
          in: query
          name: payType
          required: false
          description: Pay type. Allowed values are tick and freeQuota.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                  msg:
                    type: string
                  data:
                    required:
                      - ids
                      - signMsgs
                    type: object
                    properties:
                      ids:
                        description: User signature id
                        type: array
                        items:
                          type: string
                      signMsgs:
                        description: User signature information
                        type: array
                        items:
                          type: string
                      feeAmount:
                        description: The fee that the user needs to pay
                        type: string
                      feeTickPrice:
                        description: The price of fee tick
                        type: string
                      feeBalance:
                        description: The user's fee tick balance
                        type: string
                      usdPrice:
                        description: The dollar value of the fee
                        type: string
                      feeTick:
                        description: Tick used as fee. Use /v1/brc20-swap/config to fetch available feeTicks.
                        type: string
                      totalFreeQuota:
                        description: Total free quota
                        type: string
                      remainingFreeQuota:
                        description: Remaining free quota
                        type: string
                      totalUsedFreeQuota:
                        description: Total used free quota
                        type: string
                      usageFreeQuota:
                        description: Usage free quota
                        type: string
                      hasVoucher:
                        description: Has voucher
                        type: boolean
                      assetFeeAmount:
                        description: Asset fee amount
                        type: string
                      assetFeeTick:
                        description: Asset fee tick
                        type: string
                      assetFeeTickPrice:
                        description: Asset fee tick price
                        type: string
                      assetFeeTickBalance:
                        description: Asset fee tick balance
                        type: string
                    additionalProperties: false
                required:
                  - msg
                  - code
                  - data
  /v1/brc20-swap/deploy_pool:
    post:
      tags:
        - Swap-BRC20
      operationId: postBrc20SwapDeployPool
      summary: Submit a signed InSwap pool deployment
      description: >-
        Creates a new swap pool using prepared signature data, token pair, timestamp, fee tick, and fee payment fields. Review the pair, fee amount, and signatures before submission.
      x-unisat-domain: swap
      x-unisat-network: fractal
      x-unisat-status: recommended
      x-unisat-readonly: false
      x-unisat-requires-confirmation: true
      x-unisat-aliases: [InSwap, BRC20 Swap]
      requestBody:
        content:
          application/json:
            schema:
              required:
                - address
                - tick0
                - tick1
                - ts
                - feeTick
                - feeAmount
                - feeTickPrice
              type: object
              properties:
                address:
                  type: string
                tick0:
                  type: string
                tick1:
                  type: string
                ts:
                  description: Timestamp (seconds)
                  type: number
                feeTick:
                  description: Tick used as fee. Use /v1/brc20-swap/config to fetch available feeTicks.
                  type: string
                feeAmount:
                  description: The fee that the user needs to pay
                  type: string
                feeTickPrice:
                  description: The price of fee tick
                  type: string
                sigs:
                  description: User signature
                  type: array
                  items:
                    type: string
                payType:
                  enum:
                    - tick
                    - freeQuota
                  type: string
                  description: Pay type. Allowed values are tick and freeQuota.
                rememberPayType:
                  type: boolean
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                  msg:
                    type: string
                  data:
                    type: object
                    properties: {}
                    additionalProperties: false
                required:
                  - msg
                  - code
                  - data
  /v1/brc20-swap/pre_add_liq:
    get:
      tags:
        - Swap-BRC20
      operationId: getBrc20SwapPreAddLiq
      summary: Prepare signatures and fee data for adding liquidity
      description: >-
        Returns signature ids, sign messages, fee fields, and pool-share preparation data for adding two token amounts into an InSwap liquidity pool.
      x-unisat-domain: swap
      x-unisat-network: fractal
      x-unisat-status: recommended
      x-unisat-readonly: true
      x-unisat-requires-confirmation: false
      x-unisat-aliases: [InSwap, BRC20 Swap]

      parameters:
        - schema:
            type: string
          in: query
          name: address
          required: true
        - schema:
            type: string
          in: query
          name: tick0
          required: true
        - schema:
            type: string
          in: query
          name: tick1
          required: true
        - schema:
            type: string
          in: query
          name: amount0
          required: true
          description: Input amount of tick0
        - schema:
            type: string
          in: query
          name: amount1
          required: true
          description: Input amount of tick1
        - schema:
            type: string
          in: query
          name: lp
          required: true
          description: Expect amount of lp
        - schema:
            type: string
          in: query
          name: slippage
          required: true
        - schema:
            type: number
          in: query
          name: ts
          required: true
          description: Timestamp (seconds)
        - schema:
            type: string
          in: query
          name: feeTick
          required: true
          description: Tick used as fee. Use /v1/brc20-swap/config to fetch available feeTicks.
        - schema:
            enum:
              - tick
              - freeQuota
            type: string
          in: query
          name: payType
          required: false
          description: Pay type. Allowed values are tick and freeQuota.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                  msg:
                    type: string
                  data:
                    required:
                      - ids
                      - signMsgs
                    type: object
                    properties:
                      ids:
                        description: User signature id
                        type: array
                        items:
                          type: string
                      signMsgs:
                        description: User signature information
                        type: array
                        items:
                          type: string
                      feeAmount:
                        description: The fee that the user needs to pay
                        type: string
                      feeTickPrice:
                        description: The price of fee tick
                        type: string
                      feeBalance:
                        description: The user's fee tick balance
                        type: string
                      usdPrice:
                        description: The dollar value of the fee
                        type: string
                      feeTick:
                        description: Tick used as fee. Use /v1/brc20-swap/config to fetch available feeTicks.
                        type: string
                      totalFreeQuota:
                        description: Total free quota
                        type: string
                      remainingFreeQuota:
                        description: Remaining free quota
                        type: string
                      totalUsedFreeQuota:
                        description: Total used free quota
                        type: string
                      usageFreeQuota:
                        description: Usage free quota
                        type: string
                      hasVoucher:
                        description: Has voucher
                        type: boolean
                      assetFeeAmount:
                        description: Asset fee amount
                        type: string
                      assetFeeTick:
                        description: Asset fee tick
                        type: string
                      assetFeeTickPrice:
                        description: Asset fee tick price
                        type: string
                      assetFeeTickBalance:
                        description: Asset fee tick balance
                        type: string
                    additionalProperties: false
                required:
                  - msg
                  - code
                  - data
  /v1/brc20-swap/add_liq:
    post:
      tags:
        - Swap-BRC20
      operationId: postBrc20SwapAddLiq
      summary: Submit a signed InSwap add-liquidity operation
      description: >-
        Adds token amounts to a liquidity pool using prepared signatures, fee fields, and slippage controls. Review both token amounts, expected LP, fee payment, and signatures before submission.
      x-unisat-domain: swap
      x-unisat-network: fractal
      x-unisat-status: recommended
      x-unisat-readonly: false
      x-unisat-requires-confirmation: true
      x-unisat-aliases: [InSwap, BRC20 Swap]
      requestBody:
        content:
          application/json:
            schema:
              required:
                - address
                - tick0
                - tick1
                - amount0
                - amount1
                - lp
                - slippage
                - ts
                - feeTick
                - feeAmount
                - feeTickPrice
              type: object
              properties:
                address:
                  type: string
                tick0:
                  type: string
                tick1:
                  type: string
                amount0:
                  description: Input amount of tick0
                  type: string
                amount1:
                  description: Input amount of tick1
                  type: string
                lp:
                  type: string
                slippage:
                  type: string
                ts:
                  description: Timestamp (seconds)
                  type: number
                feeTick:
                  description: Tick used as fee. Use /v1/brc20-swap/config to fetch available feeTicks.
                  type: string
                feeAmount:
                  description: The fee that the user needs to pay
                  type: string
                feeTickPrice:
                  description: The price of fee tick
                  type: string
                sigs:
                  description: User signature
                  type: array
                  items:
                    type: string
                payType:
                  enum:
                    - tick
                    - freeQuota
                  type: string
                  description: Pay type. Allowed values are tick and freeQuota.
                rememberPayType:
                  type: boolean
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                  msg:
                    type: string
                  data:
                    required:
                      - amount0
                      - amount1
                    type: object
                    properties:
                      id:
                        description: Function id
                        type: string
                      rollupInscriptionId:
                        description: The rollup inscription id where the function is located
                        type: string
                      address:
                        type: string
                      type:
                        type: string
                      tick0:
                        type: string
                      tick1:
                        type: string
                      amount0:
                        description: Input amount of tick0
                        type: string
                      amount1:
                        description: Input amount of tick1
                        type: string
                      lp:
                        type: string
                      ts:
                        type: number
                      success:
                        description: Operation success status
                        type: boolean
                      value:
                        description: Operation value
                        type: number
                      preResult:
                        description: Pre-operation result
                        type: object
                      result:
                        description: Operation result
                        type: object
                    additionalProperties: false
                required:
                  - msg
                  - code
                  - data
  /v1/brc20-swap/pre_remove_liq:
    get:
      tags:
        - Swap-BRC20
      operationId: getBrc20SwapPreRemoveLiq
      summary: Prepare signatures and fee data for removing liquidity
      description: >-
        Returns signature ids, sign messages, fee fields, and expected token amounts for removing LP from an InSwap liquidity pool.
      x-unisat-domain: swap
      x-unisat-network: fractal
      x-unisat-status: recommended
      x-unisat-readonly: true
      x-unisat-requires-confirmation: false
      x-unisat-aliases: [InSwap, BRC20 Swap]

      parameters:
        - schema:
            type: string
          in: query
          name: address
          required: true
        - schema:
            type: string
          in: query
          name: tick0
          required: true
        - schema:
            type: string
          in: query
          name: tick1
          required: true
        - schema:
            type: string
          in: query
          name: amount0
          required: true
          description: Input amount of tick0
        - schema:
            type: string
          in: query
          name: amount1
          required: true
          description: Input amount of tick1
        - schema:
            type: string
          in: query
          name: lp
          required: true
        - schema:
            type: string
          in: query
          name: slippage
          required: true
        - schema:
            type: number
          in: query
          name: ts
          required: true
        - schema:
            type: string
          in: query
          name: feeTick
          required: true
          description: Tick used as fee. Use /v1/brc20-swap/config to fetch available feeTicks.
        - schema:
            enum:
              - tick
              - freeQuota
            type: string
          in: query
          name: payType
          required: false
          description: Pay type. Allowed values are tick and freeQuota.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                  msg:
                    type: string
                  data:
                    required:
                      - ids
                      - signMsgs
                    type: object
                    properties:
                      ids:
                        description: User signature id
                        type: array
                        items:
                          type: string
                      signMsgs:
                        description: User signature information
                        type: array
                        items:
                          type: string
                      feeAmount:
                        description: The fee that the user needs to pay
                        type: string
                      feeTickPrice:
                        description: The price of fee tick
                        type: string
                      feeBalance:
                        description: The user's fee tick balance
                        type: string
                      usdPrice:
                        description: The dollar value of the fee
                        type: string
                      feeTick:
                        description: Tick used as fee. Use /v1/brc20-swap/config to fetch available feeTicks.
                        type: string
                      totalFreeQuota:
                        description: Total free quota
                        type: string
                      remainingFreeQuota:
                        description: Remaining free quota
                        type: string
                      totalUsedFreeQuota:
                        description: Total used free quota
                        type: string
                      usageFreeQuota:
                        description: Usage free quota
                        type: string
                      hasVoucher:
                        description: Has voucher
                        type: boolean
                      assetFeeAmount:
                        description: Asset fee amount
                        type: string
                      assetFeeTick:
                        description: Asset fee tick
                        type: string
                      assetFeeTickPrice:
                        description: Asset fee tick price
                        type: string
                      assetFeeTickBalance:
                        description: Asset fee tick balance
                        type: string
                      reward0:
                        description: Reward amount for tick0
                        type: string
                      reward1:
                        description: Reward amount for tick1
                        type: string
                    additionalProperties: false
                required:
                  - msg
                  - code
                  - data
  /v1/brc20-swap/remove_liq:
    post:
      tags:
        - Swap-BRC20
      operationId: postBrc20SwapRemoveLiq
      summary: Submit a signed InSwap remove-liquidity operation
      description: >-
