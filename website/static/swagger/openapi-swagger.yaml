      summary: Get latest BTC price in USD
      description: >-
        Returns the latest BTC price quote with the USD price and Unix
        updateTime timestamp. Use this read-only endpoint for wallets,
        marketplaces, fee estimators, and portfolio views that need a public BTC
        reference price without creating orders, signatures, or transactions.
      x-unisat-domain: price
      x-unisat-network: multi
      x-unisat-status: recommended
      x-unisat-readonly: true
      x-unisat-requires-confirmation: false
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: integer
                    format: int32
                  msg:
                    type: string
                    example: ok
                  data:
                    $ref: '#/components/schemas/PriceInfo'
        '401':
          description: Invalid API Key
